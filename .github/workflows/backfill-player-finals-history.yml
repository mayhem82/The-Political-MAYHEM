name: Backfill Political MAYHEM Player Finals History

on:
  push:
    branches: [main]
    paths:
      - scripts/backfill-federal-player-finals-history.mjs
      - .github/workflows/backfill-player-finals-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-federal-finals-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backfill Federal finals history from AEC
        run: node scripts/backfill-federal-player-finals-history.mjs
      - name: Validate player finals history
        run: node scripts/validate-player-finals-history.mjs
      - name: Commit generated history
        run: |
          if git diff --quiet -- data/runtime/player-finals-history.json; then
            echo "No history changes"
            exit 0
          fi
          git config user.name "political-mayhem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/runtime/player-finals-history.json
          git commit -m "Backfill Federal player finals history from AEC"
          git push
