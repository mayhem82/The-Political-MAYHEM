name: Capture Forward Political Signals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-forward-capture-transition.mjs'
      - 'scripts/capture-forward-signals.mjs'
      - 'scripts/review-forward-signals.mjs'
      - 'scripts/ingest-source-record-details.mjs'
      - 'scripts/route-area-evidence.mjs'
      - 'scripts/build-information-ingestion-coverage.mjs'
      - 'scripts/reconcile-political-lifecycle.mjs'
      - 'scripts/discover-political-competitions.mjs'
      - 'scripts/validate-information-ingestion-pipeline.mjs'
      - 'scripts/validate-information-ingestion-runtime.mjs'
      - 'scripts/validate-forward-signal-integrity-v2.mjs'
      - 'scripts/validate-competition-discovery.mjs'
      - 'data/forward-signal-source-registry.json'
      - 'data/forward-signal-review-policy.json'
      - 'data/forward-capture-transition-register.json'
      - 'data/political-information-ingestion-pipeline.json'
      - 'data/political-competition-class-registry.json'
      - 'data/political-cycle-class-registry.json'
      - 'data/runtime/source-detail-snapshots.json'
      - 'data/runtime/area-evidence-records.json'
      - 'data/runtime/information-ingestion-coverage.json'
      - 'data/runtime/political-cycles.json'
      - 'data/runtime/political-contests.json'
      - 'data/runtime/contest-checkpoints.json'
      - 'data/runtime/competition-discovery-candidates.json'
      - 'data/runtime/verified-outcomes.json'
      - '.github/workflows/capture-forward-signals.yml'

permissions:
  contents: write

concurrency:
  group: political-mayhem-forward-signal-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare closed capture transition
        run: node scripts/prepare-forward-capture-transition.mjs
      - name: Capture raw forward source state
        run: node scripts/capture-forward-signals.mjs
      - name: Review structured source changes
        run: node scripts/review-forward-signals.mjs
      - name: Acquire substantive source record details
        run: node scripts/ingest-source-record-details.mjs
      - name: Route substantive evidence into competition areas
        run: node scripts/route-area-evidence.mjs
      - name: Build jurisdiction by competition-area ingestion coverage
        run: node scripts/build-information-ingestion-coverage.mjs
      - name: Reconcile political lifecycle
        run: node scripts/reconcile-political-lifecycle.mjs
      - name: Discover Political MAYHEM competition candidates
        run: node scripts/discover-political-competitions.mjs
      - name: Validate complete Political MAYHEM state
        run: |
          node scripts/validate-information-ingestion-pipeline.mjs
          node scripts/validate-information-ingestion-runtime.mjs
          node scripts/validate-forward-integrity.mjs
          node scripts/validate-forward-signal-integrity-v2.mjs
          node scripts/validate-projection-integrity.mjs
          node scripts/validate-political-lifecycle.mjs
          node scripts/validate-political-competition-classes.mjs
          node scripts/validate-competition-discovery.mjs
          node scripts/validate-player-competition-slate.mjs
          node scripts/validate-competition-events.mjs
          node scripts/validate-political-temporal-engine.mjs
          node scripts/validate-record-diff-engine.mjs
          node scripts/validate-political-normalize-engine.mjs
          node scripts/validate-political-conflict-engine.mjs
          node scripts/validate-political-abstention-integrity.mjs
          node scripts/validate-political-research-sites.mjs
          node scripts/validate-state-territory-rosters.mjs
          node scripts/validate-federal-senate-electoral-integrity.mjs
      - name: Commit captured, reviewed, ingested, screened and reconciled state
        run: |
          if git diff --quiet -- data/runtime/forward-signal-capture-state.json data/runtime/source-snapshots.json data/runtime/intelligence-events.json data/runtime/signal-reviews.json data/runtime/source-detail-snapshots.json data/runtime/area-evidence-records.json data/runtime/information-ingestion-coverage.json data/runtime/forward-ingestion-manifest.json data/runtime/political-cycles.json data/runtime/political-contests.json data/runtime/contest-checkpoints.json data/runtime/competition-discovery-candidates.json; then
            echo 'No new capture, substantive ingestion, coverage, lifecycle or competition-discovery state.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/forward-signal-capture-state.json data/runtime/source-snapshots.json data/runtime/intelligence-events.json data/runtime/signal-reviews.json data/runtime/source-detail-snapshots.json data/runtime/area-evidence-records.json data/runtime/information-ingestion-coverage.json data/runtime/forward-ingestion-manifest.json data/runtime/political-cycles.json data/runtime/political-contests.json data/runtime/contest-checkpoints.json data/runtime/competition-discovery-candidates.json
          git commit -m 'Capture review ingest cover and screen political state'
          git pull --rebase origin main
          git push origin main
