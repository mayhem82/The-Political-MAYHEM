name: Political MAYHEM Forward Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-forward-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate forward integrity
        run: node scripts/validate-forward-integrity.mjs
      - name: Validate forward signal capture
        run: node scripts/validate-forward-signal-integrity-v2.mjs
      - name: Validate projection integrity
        run: node scripts/validate-projection-integrity.mjs
      - name: Validate political lifecycle
        run: node scripts/validate-political-lifecycle.mjs
      - name: Validate Political MAYHEM competition classes
        run: node scripts/validate-political-competition-classes.mjs
      - name: Validate competition discovery
        run: node scripts/validate-competition-discovery.mjs
      - name: Validate player competition slate
        run: node scripts/validate-player-competition-slate.mjs
      - name: Validate Political MAYHEM match events
        run: node scripts/validate-competition-events.mjs
      - name: Validate political temporal engine
        run: node scripts/validate-political-temporal-engine.mjs
      - name: Validate record diff engine
        run: node scripts/validate-record-diff-engine.mjs
      - name: Validate political normalization engine
        run: node scripts/validate-political-normalize-engine.mjs
      - name: Validate political contradiction engine
        run: node scripts/validate-political-conflict-engine.mjs
      - name: Validate political abstention integrity
        run: node scripts/validate-political-abstention-integrity.mjs
      - name: Validate Political Research Sites parity
        run: node scripts/validate-political-research-sites.mjs
      - name: Validate state and territory rosters
        run: node scripts/validate-state-territory-rosters.mjs
      - name: Validate federal Senate electoral statistics
        run: node scripts/validate-federal-senate-electoral-integrity.mjs
