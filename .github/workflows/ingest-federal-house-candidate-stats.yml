name: Ingest Federal House Candidate Stats

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ingest-federal-house-candidate-stats.mjs'
      - '.github/workflows/ingest-federal-house-candidate-stats.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ingest final House candidate statistics
        run: node scripts/ingest-federal-house-candidate-stats.mjs
      - name: Commit refreshed runtime snapshot
        run: |
          if git diff --quiet -- data/runtime/federal-house-electoral-performance-v2.json; then
            echo 'No electoral runtime change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/federal-house-electoral-performance-v2.json
          git commit -m 'Ingest federal House candidate statistics'
          git push
