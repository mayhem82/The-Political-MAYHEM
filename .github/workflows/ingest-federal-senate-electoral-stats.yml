name: Ingest Federal Senate Electoral Stats

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ingest-federal-senate-electoral-stats.mjs'
      - '.github/workflows/ingest-federal-senate-electoral-stats.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * 1'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ingest Senate electoral statistics
        run: node scripts/ingest-federal-senate-electoral-stats.mjs
      - name: Commit refreshed Senate runtime snapshot
        run: |
          if git diff --quiet -- data/runtime/federal-senate-electoral-performance.json; then
            echo 'No Senate electoral runtime change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/federal-senate-electoral-performance.json
          git commit -m 'Ingest federal Senate electoral statistics'
          git push
