name: Ingest Forward Political Signal Seeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/forward-signal-seeds/**'
      - 'scripts/ingest-forward-signal-seeds.mjs'
      - '.github/workflows/ingest-forward-signal-seeds.yml'

permissions:
  contents: write

concurrency:
  group: political-mayhem-forward-signal-seeds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ingest forward signal seeds
        run: node scripts/ingest-forward-signal-seeds.mjs
      - name: Commit runtime ledgers
        run: |
          if git diff --quiet -- data/runtime/source-snapshots.json data/runtime/intelligence-events.json data/runtime/forward-ingestion-manifest.json; then
            echo 'No un-ingested forward signal seeds.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/source-snapshots.json data/runtime/intelligence-events.json data/runtime/forward-ingestion-manifest.json
          git commit -m 'Ingest forward political signal seeds'
          git pull --rebase origin main
          git push origin main
